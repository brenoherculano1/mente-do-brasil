indicator_id: suicide_asmr
indicator_name_pt: Mortalidade por suicidio padronizada por idade
indicator_name_en: Age-standardized suicide mortality rate
domain: need
description: Pooled 2022-2024 suicide mortality rate directly age-standardized by locked age bands.
interpretation: Relative regional indicator of severe mental-health-related mortality.
what_it_does_not_measure:
  - prevalence of mental disorders
  - unmet need
  - access to care
  - service quality
source_organization: DATASUS
source_system: SIM
source_dataset: Mortality Information System
source_file_pattern: PLACEHOLDER_SOURCE_FILE_PATTERN
source_url: PLACEHOLDER_SOURCE_URL
observation_start: "2022-01-01"
observation_end: "2024-12-31"
reference_date: null
extracted_at: PLACEHOLDER_EXTRACTED_AT
geography_version: BR_HEALTH_REGIONS_END2024_V1
aggregation_geography: Health Region
numerator_definition: Deaths by underlying-cause ICD-10 X60-X84, residence-based.
denominator_definition: Population person-years from locked DATASUS/IBGE denominators.
unit: deaths per 100,000 person-years
filters:
  icd10_underlying_cause: X60-X84
  geography: municipality of residence to Health Region
transformation: national Health Region percentile rank for composite construction
standardization_method: direct age standardization using locked five-year age bands with 90-plus terminal category
missing_value_rule: missing values remain explicit and are not converted to zero
small_number_rule: flag regions with fewer than 10 pooled deaths as SMALL_SUICIDE_COUNT
deduplication_rule: not applicable to mortality records at aggregate stage
method_version: MDB_METHOD_1.0
code_version: PLACEHOLDER_CODE_VERSION
