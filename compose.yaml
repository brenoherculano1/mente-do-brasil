services:
  postgres:
    build:
      context: ./db/docker
      dockerfile: Dockerfile
    image: mente-do-brasil-postgis:18-3.6.4
    container_name: mente-do-brasil-postgres
    environment:
      POSTGRES_DB: ${MDB_DB_NAME:-mente_do_brasil}
      POSTGRES_USER: ${MDB_DB_USER:-mente_do_brasil}
      POSTGRES_PASSWORD: ${MDB_DB_PASSWORD:?Set MDB_DB_PASSWORD in local .env}
    ports:
      - "127.0.0.1:${MDB_DB_PORT:-5432}:5432"
    volumes:
      - mente_do_brasil_pgdata:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${MDB_DB_USER:-mente_do_brasil} -d ${MDB_DB_NAME:-mente_do_brasil}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mente_do_brasil_pgdata:
