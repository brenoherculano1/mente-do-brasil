services:
  postgres:
    image: postgis/postgis:18-3.6
    container_name: mente-do-brasil-postgres
    environment:
      POSTGRES_DB: ${MDB_DB_NAME:-mente_do_brasil}
      POSTGRES_USER: ${MDB_DB_USER:-mente_do_brasil}
      POSTGRES_PASSWORD: ${MDB_DB_PASSWORD:-CHANGE_ME}
    ports:
      - "${MDB_DB_PORT:-5432}:5432"
    volumes:
      - mente_do_brasil_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${MDB_DB_USER:-mente_do_brasil} -d ${MDB_DB_NAME:-mente_do_brasil}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mente_do_brasil_pgdata:
