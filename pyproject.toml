[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mente-do-brasil"
version = "0.1.0"
description = "Scientific data foundation for Mente do Brasil territorial mental-health intelligence."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116",
  "pandas>=2.0",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pyarrow>=14",
  "pydantic>=2",
  "PyYAML>=6",
  "uvicorn>=0.35",
  "reportlab==4.2.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]
geo = [
  "geopandas>=0.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
